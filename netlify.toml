# Configuration Netlify (reprend les réglages de l'interface : base « / », publication à la racine).
[build]
  publish = "."
  functions = "netlify/functions"

# Protection de tout le site par mot de passe : netlify/edge-functions/auth.js
# (identifiants dans la variable d'environnement BASIC_AUTH, jamais dans le dépôt).
[[edge_functions]]
  path = "/*"
  function = "auth"
