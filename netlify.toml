# Configuration Netlify (reprend les réglages de l'interface : base « / », publication à la racine).
[build]
  publish = "."
  functions = "netlify/functions"
  # Génère _headers (protection Basic-Auth) à partir de la variable BASIC_AUTH.
  # Échoue si BASIC_AUTH est absente : aucun site non protégé ne peut être publié.
  command = "node generate-headers.js"
